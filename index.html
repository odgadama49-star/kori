l}</button>`}function appShell(){return `<div class="app"><aside class="side" id="side">${logo()}<button class="country" onclick="countryModal()"><span class="flag">${countries.find(c=>c[1]===country)?.[0]}</span><span><b>${country}</b><small>UEMOA · FCFA (XOF)</small></span><span class="down">⌄</span></button><div class="label">MON ESPACE</div><nav class="nav">${navBtn('home','◫','Vue d’ensemble')}${navBtn('transactions','↕','Transactions')}${navBtn('budgets','◷','Mes budgets')}${navBtn('goals','◎','Objectifs d’épargne')}</nav><div class="side-bottom"><div class="ad-mini"><small>OFFRE PARTENAIRE</small><b>Des économies près de chez vous</b><p>Offres locales pertinentes soutiennent la version gratuite.</p></div><div class="nav">${navBtn('settings','⚙','Préférences')}${navBtn('plans','✦','Kori Plus')}</div><div class="side-user"><div class="user-avatar">AM</div><div><b>Bonjour !</b><small>Mon espace personnel</small></div></div></div></aside><div class="overlay" id="overlay" onclick="closeMenu()"></div><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="topbtn mobile-menu" onclick="toggleMenu()">☰</button><div class="bread">Kori <span style="padding:0 5px;color:#c5cdc5">/</span><b id="bread">Vue d’ensemble</b></div></div><div class="topright"><span class="demo-label">Démo · données fictives</span><button class="topbtn" aria-label="Ajouter" onclick="addModal()">＋</button></div></header><section class="wrap" id="view"></section><nav class="mobile-nav"><button class="${activePage==='home'?'active':''}" data-page="home" onclick="showPage('home')"><span>&#8962;</span>Accueil</button><button class="${activePage==='transactions'?'active':''}" data-page="transactions" onclick="showPage('transactions')"><span>&#8645;</span>Opérations</button><button class="add-nav" aria-label="Ajouter" onclick="addModal()">+</button><button class="${activePage==='budgets'?'active':''}" data-page="budgets" onclick="showPage('budgets')"><span>&#9719;</span>Budgets</button><button class="${activePage==='goals'?'active':''}" data-page="goals" onclick="showPage('goals')"><span>&#9678;</span>Projets</button></nav></main></div>`}function dashboard(){return `<div class="welcome"><div><div class="eyebrow">JEUDI 8 OCTOBRE · VOTRE ESPACE</div><h1>Votre budget, en un coup d'oeil.</h1><p>Ajoutez vos dépenses au fil de la journée pour mieux savoir où vous en êtes.</p></div><button class="btn primary" onclick="addModal()">＋ &nbsp;Noter une dépense</button></div><div class="grid-top"><div class="balance-card"><div class="muted">IL TE RESTE POUR CE MOIS</div><div class="balance" id="remaining">126 500 <span>FCFA</span></div><div class="monthdelta">Sur votre budget de 250 000 FCFA · Déjà dépensé <b id="spent">123 500 FCFA</b></div><div class="bal-actions"><button class="btn outline" onclick="showPage('budgets')">Ajuster mon budget</button><button class="btn lime" onclick="showPage('goals')">＋ Épargne</button></div></div><div class="stats-small"><div class="statbox"><small>DÉPENSES CE MOIS</small><b id="totalSpent">123 500 FCFA</b><span>↘ 8 % vs mois dernier</span></div><div class="statbox"><small>AUJOURD’HUI</small><b id="todaySpent">14 000 FCFA</b><span class="warn">Votre suivi est à jour</span></div><div class="statbox"><small>CATÉGORIES SUIVIES</small><b>5</b><span>Alimentation en tête</span></div><div class="statbox"><small>OBJECTIF D’ÉPARGNE</small><b>35 000 FCFA</b><span>35 % de votre objectif</span></div></div></div><div class="two-col"><div class="panel"><div class="panel-head"><div><h2>Mes dépenses</h2><p>Vos dépenses au fil du mois</p></div><select class="select"><option>Ce mois-ci</option><option>Mois dernier</option></select></div><div class="chart"><svg viewBox="0 0 650 145" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#70a77a" stop-opacity=".23"/><stop offset="1" stop-color="#70a77a" stop-opacity="0"/></linearGradient></defs><path d="M0 113 Q40 99 81 106 T162 72 T244 87 T325 55 T406 72 T487 35 T568 57 T650 25 L650 145 L0 145Z" fill="url(#fill)"/><path d="M0 113 Q40 99 81 106 T162 72 T244 87 T325 55 T406 72 T487 35 T568 57 T650 25" fill="none" stroke="#397c59" stroke-width="3"/></svg></div><div class="months"><span>1 oct.</span><span>5 oct.</span><span>10 oct.</span><span>15 oct.</span><span>20 oct.</span><span>31 oct.</span></div></div><div class="panel"><div class="panel-head"><div><h2>Mes budgets</h2><p>Vos limites par catégorie</p></div><button class="seeall" onclick="showPage('budgets')">Tout voir →</button></div><div class="budgets">${budgetRow('🛒','Alimentation','54 500','80 000',68,'')}${budgetRow('🚌','Transport','22 000','35 000',63,'')}${budgetRow('🏠','Maison','30 000','40 000',75,'orange')}${budgetRow('📱','Factures','12 000','25 000',48,'')}${budgetRow('💊','Santé','5 000','20 000',25,'')}</div></div></div><div class="panel transaction-panel"><div class="panel-head"><div><h2>Dernières opérations</h2><p>Les mouvements ajoutés récemment</p></div><button class="seeall" onclick="showPage('transactions')">Toutes mes opérations →</button></div>${transactionTable(transactions.slice(0,4))}</div><div class="adbar"><span class="adlabel">PUB</span><div><b>Une offre pratique pour votre quotidien</b><p>Les partenaires de Kori contribuent à garder l’application gratuite.</p></div><a href="#" onclick="event.preventDefault();toast('Espace partenaire de démonstration')">Découvrir →</a></div>`}function budgetRow(ico,name,spent,total,pct,tone){return `<div class="budget"><div class="budget-line"><span><i class="emoji">${ico}</i>${name}</span><span><b>${spent}</b> <small>/ ${total} FCFA</small></span></div><div class="track"><i class="${tone}" style="width:${pct}%"></i></div><div class="budget-foot">${pct}% du budget utilisé</div></div>`}function transactionTable(rows){return `<div class="scroll"><table class="transactions"><thead><tr><th>OPÉRATION</th><th>CATÉGORIE</th><th>DATE</th><th style="text-align:right">MONTANT</th></tr></thead><tbody>${rows.map(t=>`<tr><td><div class="what"><span class="tx-icon">${t.icon}</span>${t.name}</div></td><td>${t.cat}</td><td>${t.date}</td><td style="text-align:right" class="${t.amount>0?'pos':'neg'}">${t.amount>0?'+':'−'} ${fmt(t.amount)}</td></tr>`).join('')}</tbody></table></div>`}function pageHead(title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">KORI · ${country.toUpperCase()}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}function showPage(id){activePage=id;document.querySelectorAll('.mobile-nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));let v=document.getElementById('view');if(!v)return;let content='';let names={home:'Vue d’ensemble',transactions:'Transactions',budgets:'Mes budgets',goals:'Objectifs d’épargne',settings:'Préférences',plans:'Kori Plus'};document.getElementById('bread').textContent=names[id];if(id==='home')content=dashboard();else if(id==='transactions')content=pageHead('Mes transactions','Toutes vos dépenses et entrées d’argent au même endroit.',`<button class="btn primary" onclick="addModal()">＋ Noter une dépense</button>`)+`<div class="toolrow"><input class="search" id="query" placeholder="⌕ Rechercher une opération…"><select class="select" id="catfilter"><option value="">Toutes les catégories</option><option>Alimentation</option><option>Transport</option><option>Revenus</option><option>Factures</option><option>Santé</option><option>Autre</option></select></div><div class="txlist" id="txlist">${transactionTable(transactions)}</div>`;else if(id==='budgets')content=pageHead('Mes budgets','Fixez une limite simple pour les dépenses qui comptent.',`<button class="btn primary" onclick="budgetModal()">＋ Créer un budget</button>`)+`<div class="panel"><div class="panel-head"><div><h2>Octobre 2026</h2><p>Budget total : 200 000 FCFA · Dépensé : 123 500 FCFA</p></div><span class="statuspill">76 500 FCFA restants</span></div><div class="budgets">${budgetRow('🛒','Alimentation','54 500','80 000',68,'')}${budgetRow('🚌','Transport','22 000','35 000',63,'')}${budgetRow('🏠','Maison','30 000','40 000',75,'orange')}${budgetRow('📱','Factures','12 000','25 000',48,'')}${budgetRow('💊','Santé','5 000','20 000',25,'')}${budgetRow('✨','Autres','0','20 000',0,'')}</div></div>`;else if(id==='goals')content=pageHead('Objectifs d’épargne','De petits pas réguliers pour les projets qui comptent.',`<button class="btn primary" onclick="goalModal()">＋ Nouvel objectif</button>`)+`<div class="two-col"><div class="panel"><div style="font-size:28px">🧳</div><h2 style="font:700 15px Manrope">Voyage en famille</h2><p style="color:var(--muted);font-size:10px">Objectif : 100 000 FCFA · Échéance : décembre</p><div class="track" style="height:9px;margin:20px 0 8px"><i style="width:35%"></i></div><div style="display:flex;justify-content:space-between;font-size:10px"><b>35 000 FCFA économisés</b><span style="color:var(--muted)">35 %</span></div><button class="btn primary" style="margin-top:17px" onclick="toast('Ajout à l’épargne disponible bientôt')">＋ Ajouter à l’objectif</button></div><div class="panel" style="background:#f0f5ea"><div class="eyebrow">UN PETIT CONSEIL</div><h2 style="font:700 16px Manrope;line-height:1.4">L’épargne commence par un objectif clair.</h2><p style="font-size:10px;color:#758177;line-height:1.7">Choisissez le montant et la date qui vous conviennent. Kori vous aide à suivre vos progrès, sans jugement.</p></div></div>`;else if(id==='settings')content=pageHead('Préférences','Choisissez la région et l’expérience qui vous correspondent.')+`<div class="panel" style="max-width:620px"><h2 style="font:700 13px Manrope">Pays et devise</h2><p style="font-size:10px;color:var(--muted)">Les pays de l’UEMOA utilisent le franc CFA (XOF).</p><button class="country" style="max-width:300px" onclick="countryModal()"><span class="flag">${countries.find(c=>c[1]===country)?.[0]}</span><span><b>${country}</b><small>Franc CFA · XOF</small></span><span class="down">Changer ⌄</span></button><div style="border-top:1px solid var(--line);padding-top:14px"><h2 style="font:700 13px Manrope">Confidentialité et données</h2><p style="font-size:10px;color:var(--muted);line-height:1.7">Vos opérations sont privées. Dans cette démo, elles restent dans la mémoire de la page et ne sont envoyées à aucun serveur.</p><button class="btn outline" onclick="toast('Les préférences seront enregistrées avec votre compte.')">Enregistrer les préférences</button></div></div>`;else if(id==='plans')content=pageHead('Kori Plus','Une formule simple pour aller plus loin.')+`<div class="two-col"><div class="panel"><div class="eyebrow">GRATUIT</div><h2 style="font:700 24px Manrope">0 FCFA</h2><p style="font-size:10px;color:var(--muted)">Suivi des dépenses, catégories et budgets de base. Avec quelques offres partenaires.</p><span class="statuspill">Votre formule actuelle</span></div><div class="panel" style="border-color:#90ae79"><div class="eyebrow">KORI PLUS</div><h2 style="font:700 24px Manrope">Tarif à définir</h2><p style="font-size:10px;color:var(--muted)">Sans publicité, budgets partagés, rappels et historique détaillé.</p><button class="btn primary" disabled>Prix à confirmer avant lancement</button><p style="font-size:9px;color:#9aa39b;margin-top:12px">Paiement réel non activé dans cette démo.</p></div></div>`;v.innerHTML=content;if(id==='transactions'){let q=document.getElementById('query'),f=document.getElementById('catfilter');function filter(){let rows=transactions.filter(t=>(t.name+t.cat).toLowerCase().includes(q.value.toLowerCase())&&(!f.value||t.cat===f.value));document.getElementById('txlist').innerHTML=transactionTable(rows)||'Aucune opération';}q.oninput=filter;f.onchange=filter}}
function update(){if(!document.getElementById('remaining'))return;let spent=transactions.filter(t=>t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0);document.getElementById('totalSpent').textContent=fmt(spent);document.getElementById('remaining').innerHTML=fmt(Math.max(250000-spent,0)).replace(' FCFA',' <span>FCFA</span>');document.getElementById('spent').textContent=fmt(spent);document.getElementById('todaySpent').textContent=fmt(transactions.filter(t=>t.date.startsWith('Aujourd’hui')&&t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0))}function modal(html){document.querySelector('.modalback')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modalback" onclick="if(event.target===this)this.remove()"><div class="modal">${html}</div></div>`)}function countryModal(){modal(`<h2>Choisir votre pays</h2><p>Kori affiche les montants en franc CFA (XOF) et adaptera les services au pays sélectionné.</p><div class="field"><label>Pays de l’UEMOA</label><select id="countryChoice">${countries.map(c=>`<option ${c[1]===country?'selected':''}>${c[1]}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn outline" onclick="document.querySelector('.modalback').remove()">Annuler</button><button class="btn primary" onclick="country=document.getElementById('countryChoice').value;document.querySelector('.modalback').remove();showPage(activePage);toast('Pays mis à jour : '+country)">Confirmer</button></div>`)}function addModal(){txType='expense';modal(`<h2>Ajouter une op&#233;ration</h2><p>Le montant d’abord. Le reste en deux gestes.</p><div class="field"><label>Je veux noter</label><div class="radio-row"><div class="radio-option selected" id="typeExpense" onclick="setType('expense')">D&#233;pense</div><div class="radio-option" id="typeIncome" onclick="setType('income')">Argent re&#231;u</div></div></div><div class="field"><label>Combien ?</label><div class="amount-input"><input id="txamount" type="number" min="1" inputmode="numeric" placeholder="0"><span>FCFA</span></div><div class="quick-amounts"><button onclick="document.getElementById('txamount').value=1000">+ 1 000</button><button onclick="document.getElementById('txamount').value=2500">+ 2 500</button><button onclick="document.getElementById('txamount').value=5000">+ 5 000</button></div></div><div class="field"><label>Pour quoi ?</label><select id="txcat"><option>Alimentation</option><option>Transport</option><option>Maison</option><option>Factures</option><option value="Sant&#233;">Sant&#233;</option><option>Revenus</option><option>Autre</option></select></div><div class="field"><label>Un petit detail (facultatif)</label><input id="txname" placeholder="Ex. marche, taxi, forfait..."></div><div class="modal-actions"><button class="btn outline" onclick="document.querySelector('.modalback').remove()">Annuler</button><button class="btn primary" onclick="saveTx()">Enregistrer</button></div>`);document.getElementById('txamount')?.focus()}let txType='expense';function setType(t){txType=t;document.getElementById('typeExpense').classList.toggle('selected',t==='expense');document.getElementById('typeIncome').classList.toggle('selected',t==='income');if(t==='income')document.getElementById('txcat').value='Revenus'}function saveTx(){let amount=+document.getElementById('txamount').value;if(amount<=0){toast('Indique un montant sup&#233;rieur &#224; z&#233;ro.');return}let cat=document.getElementById('txcat').value,name=document.getElementById('txname').value.trim(),fallback={Alimentation:'Courses',Transport:'Transport',Maison:'Maison',Factures:'Facture',Sant\u00e9:'Sant\u00e9',Sant\u00e9:'Sant\u00e9',Revenus:'Revenu',Autre:'Autre depense'};name=name||fallback[cat]||cat;let icons={Alimentation:'🛒',Transport:'🚌',Maison:'🏠',Factures:'📱',Sant\u00e9:'💊',Revenus:'💼',Autre:'✳'};transactions.unshift({icon:icons[cat],name,cat,date:'Aujourd’hui · maintenant',amount:txType==='income'?amount:-amount});document.querySelector('.modalback').remove();showPage(activePage);update();toast('Op&#233;ration ajout&#233;e au suivi.')}function budgetModal(){modal(`<h2>Créer un budget</h2><p>Choisissez une catégorie et un montant maximum pour le mois.</p><div class="field"><label>Catégorie</label><select><option>Alimentation</option><option>Transport</option><option>Maison</option><option>Factures</option><option>Santé</option><option>Autre</option></select></div><div class="field"><label>Limite mensuelle (FCFA)</label><input type="number" placeholder="Ex. 50 000"></div><div class="modal-actions"><button class="btn outline" onclick="document.querySelector('.modalback').remove()">Annuler</button><button class="btn primary" onclick="document.querySelector('.modalback').remove();toast('Budget créé (démo)')">Créer mon budget</button></div>`)}function goalModal(){modal(`<h2>Créer un objectif</h2><p>Donnez un nom à votre projet et définissez son montant.</p><div class="field"><label>Mon projet</label><input placeholder="Ex. Rentrée scolaire"></div><div class="field"><label>Montant visé (FCFA)</label><input type="number" placeholder="Ex. 75 000"></div><div class="modal-actions"><button class="btn outline" onclick="document.querySelector('.modalback').remove()">Annuler</button><button class="btn primary" onclick="document.querySelector('.modalback').remove();toast('Objectif enregistré (démo)')">Créer mon objectif</button></div>`)}function payModal(){if(country!=='Burkina Faso'){modal(`<h2>Paiement Mobile Money</h2><p>Le choix du prestataire doit être configuré et confirmé pour ${country}. Le Burkina Faso est le premier marché prévu pour la démo.</p><div class="field"><label>Étape prévue</label><input value="Connexion à un opérateur local après lancement" disabled></div><div class="modal-actions"><button class="btn outline" onclick="document.querySelector('.modalback').remove()">Fermer</button></div>`);return}modal(`<h2>Choisir un moyen de paiement</h2><p>Burkina Faso · Paiement de Kori Plus : 1 000 FCFA / mois. Maquette uniquement; aucune transaction réelle.</p><div class="radio-row"><div class="radio-option selected" onclick="this.parentElement.querySelectorAll('.radio-option').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')">Orange Money</div><div class="radio-option" onclick="this.parentElement.querySelectorAll('.radio-option').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')">Wave</div></div><div class="field"><label>Numéro Mobile Money (exemple)</label><input placeholder="Ex. 07 00 00 00 00"></div><div class="modal-actions"><button class="btn outline" onclick="document.querySelector('.modalback').remove()">Fermer</button><button class="btn primary" onclick="toast('Paiement non activé dans la démo');document.querySelector('.modalback').remove()">Continuer</button></div>`)}function toast(s){document.querySelector('.toast')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast">${s}</div>`);setTimeout(()=>document.querySelector('.toast')?.remove(),2800)}function openApp(){root.innerHTML=appShell();activePage='home';showPage('home');update()}function toggleMenu(){document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('show')}function closeMenu(){document.getElementById('side')?.classList.remove('open');document.getElementById('overlay')?.classList.remove('show')}root.innerHTML=landing();
</script><script src="cloud-ui.js"></script></body></html>
